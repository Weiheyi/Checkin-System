<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>好友 - 学习打卡系统</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://dhemqusvocjcbfvopwcm.supabase.co" crossorigin>
    <link rel="stylesheet" href="css/style.css">
    <script>
        (function () {
            try {
                var el = document.documentElement;
                var t = localStorage.getItem('checkin_theme') || 'system';
                var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                el.dataset.theme = dark ? 'dark' : 'light';

                // 界面样式（配色）与界面透明度也在这里先套上，避免刷新时闪一下
                var accent = localStorage.getItem('checkin_accent');
                if (accent && accent !== 'default') el.dataset.accent = accent;

                var alpha = Number(localStorage.getItem('checkin_ui_alpha'));
                if (alpha >= 30 && alpha < 100) el.style.setProperty('--ui-alpha', alpha + '%');
            } catch (e) {}
        })();
    </script>
    <link rel="modulepreload" href="js/config.js">
    <link rel="modulepreload" href="js/supabase.js">
    <link rel="modulepreload" href="js/store.js">
    <link rel="modulepreload" href="js/ui.js">
    <link rel="modulepreload" href="js/theme.js">
    <link rel="modulepreload" href="js/shell.js">
    <link rel="modulepreload" href="js/api.js">
</head>
<body class="app-body">
    <div class="container">
        <div id="appShell"></div>

        <section class="card">
            <div class="segmented" id="segmented" role="tablist">
                <button type="button" class="active" data-tab="feed" role="tab" aria-selected="true">动态</button>
                <button type="button" data-tab="rank" role="tab" aria-selected="false">排行榜</button>
                <button type="button" data-tab="friends" role="tab" aria-selected="false">好友</button>
                <button type="button" data-tab="messages" role="tab" aria-selected="false">私信<span class="seg-badge" id="msgBadge" hidden></span></button>
            </div>

            <div id="panelFeed">
                <div id="feedList"></div>
            </div>

            <div id="panelRank" hidden>
                <div id="rankList"></div>
            </div>

            <div id="panelFriends" hidden>
                <div class="add-friend">
                    <input type="email" class="text-input" id="friendEmail" placeholder="输入好友邮箱精确添加" autocomplete="off">
                    <button class="add-task-btn" id="addFriendBtn" type="button">添加</button>
                </div>
                <div id="friendList"></div>
            </div>

            <div id="panelMessages" hidden>
                <div id="msgList"></div>
                <div id="msgThread" hidden></div>
            </div>
        </section>
    </div>

    <script src="vendor/supabase.js"></script>
    <script type="module" src="js/friends.js"></script>
</body>
</html>
