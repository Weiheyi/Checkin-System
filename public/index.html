<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 学习打卡系统</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://dhemqusvocjcbfvopwcm.supabase.co" crossorigin>
    <script>
        (function () {
            try {
                var el = document.documentElement;
                var t = localStorage.getItem('checkin_theme') || 'system';
                var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                el.dataset.theme = dark ? 'dark' : 'light';

                // 界面样式（配色）与界面透明度也在这里先套上，避免刷新时闪一下
                var accent = localStorage.getItem('checkin_accent');
                if (accent && accent !== 'default') el.dataset.accent = accent;

                var alpha = Number(localStorage.getItem('checkin_ui_alpha'));
                if (alpha >= 30 && alpha < 100) el.style.setProperty('--ui-alpha', alpha + '%');
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-brand">
                <span class="brand-icon">📚</span>
                <h1>学习打卡系统</h1>
                <p class="auth-subtitle">记录每一天的坚持</p>
            </div>

            <div class="tabs" role="tablist" id="tabsBar">
                <button class="tab active" data-tab="login" role="tab" aria-selected="true">登录</button>
                <button class="tab" data-tab="register" role="tab" aria-selected="false">注册</button>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="loginEmail">邮箱</label>
                    <input type="email" id="loginEmail" autocomplete="email" required placeholder="请输入邮箱">
                </div>
                <div class="form-group">
                    <label for="loginPassword">密码</label>
                    <input type="password" id="loginPassword" autocomplete="current-password" required placeholder="请输入密码">
                </div>
                <div class="form-group">
                    <label for="loginMathAnswer">人机验证：<span id="loginMathQuestion" class="math-question" aria-live="polite"></span></label>
                    <div class="math-input-row">
                        <input type="text" id="loginMathAnswer" class="math-answer" inputmode="numeric" autocomplete="off" required placeholder="请输入计算结果">
                        <button type="button" id="loginMathRefresh" class="math-refresh" title="换一题" aria-label="换一题">↻</button>
                    </div>
                </div>
                <button type="submit" class="btn-primary">登录</button>
                <div id="loginMessage" class="form-message" role="alert"></div>
            </form>

            <form id="registerForm" class="auth-form hidden">
                <div class="form-group">
                    <label for="regEmail">邮箱</label>
                    <input type="email" id="regEmail" autocomplete="email" required placeholder="请输入邮箱">
                </div>
                <div class="form-group">
                    <label for="regNickname">昵称</label>
                    <input type="text" id="regNickname" autocomplete="nickname" placeholder="请输入昵称（可选）">
                </div>
                <div class="form-group">
                    <label for="regPassword">密码</label>
                    <input type="password" id="regPassword" autocomplete="new-password" required placeholder="请输入密码（至少 6 位）">
                </div>
                <div class="form-group">
                    <label for="regPasswordConfirm">确认密码</label>
                    <input type="password" id="regPasswordConfirm" autocomplete="new-password" required placeholder="请再次输入密码">
                </div>
                <div class="form-group">
                    <label for="regMathAnswer">人机验证：<span id="regMathQuestion" class="math-question" aria-live="polite"></span></label>
                    <div class="math-input-row">
                        <input type="text" id="regMathAnswer" class="math-answer" inputmode="numeric" autocomplete="off" required placeholder="请输入计算结果">
                        <button type="button" id="regMathRefresh" class="math-refresh" title="换一题" aria-label="换一题">↻</button>
                    </div>
                </div>
                <button type="submit" class="btn-primary">注册</button>
                <div id="registerMessage" class="form-message" role="alert"></div>
            </form>
        </div>
    </div>

    <script src="vendor/supabase.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
