<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打卡主页 - 学习打卡系统</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://dhemqusvocjcbfvopwcm.supabase.co" crossorigin>
    <link rel="stylesheet" href="css/style.css">
    <script>
        (function () {
            try {
                var el = document.documentElement;
                var t = localStorage.getItem('checkin_theme') || 'system';
                var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                el.dataset.theme = dark ? 'dark' : 'light';

                // 界面样式（配色）与界面透明度也在这里先套上，避免刷新时闪一下
                var accent = localStorage.getItem('checkin_accent');
                if (accent && accent !== 'default') el.dataset.accent = accent;

                var alpha = Number(localStorage.getItem('checkin_ui_alpha'));
                if (alpha >= 30 && alpha < 100) el.style.setProperty('--ui-alpha', alpha + '%');
            } catch (e) {}
        })();
    </script>
    <link rel="modulepreload" href="js/config.js">
    <link rel="modulepreload" href="js/supabase.js">
    <link rel="modulepreload" href="js/store.js">
    <link rel="modulepreload" href="js/ui.js">
    <link rel="modulepreload" href="js/theme.js">
    <link rel="modulepreload" href="js/shell.js">
    <link rel="modulepreload" href="js/api.js">
</head>
<body class="app-body">
    <div class="container">
        <div id="appShell"></div>

        <section class="card hero">
            <div class="date" id="currentDate"></div>
            <button class="check-in-btn" id="checkInBtn" type="button">今日打卡</button>
        </section>

        <section class="card" id="taskSection" hidden>
            <h3 class="card-title">今日任务</h3>
            <div class="task-input-wrapper">
                <input type="text" class="task-input" id="taskInput" placeholder="输入今天的学习任务..." autocomplete="off">
                <button class="add-task-btn" id="addTaskBtn" type="button">添加</button>
            </div>
            <ul class="task-list" id="taskList"></ul>
            <p class="empty-hint" id="taskEmpty">还没有任务，添加一个吧</p>
        </section>

        <section class="card">
            <h3 class="card-title">📊 学习统计</h3>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-icon">🔥</div>
                    <div class="stat-number" id="streakDays">0</div>
                    <div class="stat-label">连续天数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-icon">📅</div>
                    <div class="stat-number" id="totalDays">0</div>
                    <div class="stat-label">打卡天数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-icon">✅</div>
                    <div class="stat-number" id="completedTasks">0</div>
                    <div class="stat-label">完成任务</div>
                </div>
                <div class="stat-item">
                    <div class="stat-icon">📈</div>
                    <div class="stat-number" id="completionRate">0%</div>
                    <div class="stat-label">完成率</div>
                </div>
            </div>
        </section>

        <section class="card promo-card">
            <div class="promo-text">
                <h3 class="card-title">🎮 学累了？放松一下</h3>
                <p class="promo-desc">写完今天的任务，来玩个小游戏换换脑子吧～</p>
            </div>
            <a class="promo-btn" href="https://weiheyi.github.io/Project1/" target="_blank" rel="noopener noreferrer">去玩一局</a>
        </section>

        <section class="card">
            <h3 class="card-title">📅 打卡历史</h3>
            <div class="history-list" id="historyList"></div>
            <p class="empty-hint" id="historyEmpty" hidden>暂无打卡记录</p>
        </section>
    </div>

    <script src="vendor/supabase.js"></script>
    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
